; Settings for a public Special Unit server, applied to <UT2004>/SpecialUnit/System/SpecialUnit.ini by
; install-server.sh (with su-ini.py: "Key=" sets a key, "+Key=" adds a line, "-Key=" removes one).
; Copy this file, edit the copy and pass it to install-server.sh to change them; running it again is safe.

[URL]
Port=7810

[Engine.GameEngine]
; the mod's default.ini still names the uplink as before the 3374 patch: no query port, no listing
-ServerActors=IpDrv.MasterServerUplink
+ServerActors=IpDrv.MasterServerLauncher
; the web admin of a UT2004 server on the same install would clash on its port
-ServerActors=UWeb.WebServer
; SU Speed (SUTweaks.MutSUSpeed) runs on clients too: they download it from the server.
; Never add SUBotFix here: it is server-side only.
+ServerPackages=SUTweaks
-ServerPackages=SUBotFix

[UWeb.WebServer]
bEnabled=False

[IpDrv.UdpGamespyQuery]
; old GameSpy query port: game port + 10 (a UT2004 server on the same install has its own)
OldQueryPortNumber=7820

[IpDrv.MasterServerUplink]
; announces the server to the master servers (333networks, openspy...)
DoUplink=True
ServerBehindNAT=False

[Engine.GameReplicationInfo]
ServerName=Special Unit: Redial - Stargate bots 24/7
ShortName=SU Redial
MOTD=Special Unit: Redial - github.com/Stargate-Redial/specialunit-redial

[Engine.GameInfo]
MaxPlayers=16
; bot skill (0-7). From 4 bots lead their shots; at the engine default of 1, bots moving to an objective hardly shoot back.
GameDifficulty=4.000000
; no map vote: it would offer the game types of a UT2004 server on the same install
VotingHandlerType=

; Map rotation. Needs SUBotFix: stock SU names its map list class without its package, so the list is
; ignored and the server just takes the next SU-* map alphabetically.
[SpecialUnit.SUMapListMission]
Maps=SU-Abydos
Maps=SU-P3X-548
Maps=SU-Chulak
Maps=SU-Antartica
Maps=SU-TokRa
Maps=SU-Asgard[Medium]
Maps=SU-IceDet
Maps=SU-Asteroid
Maps=SU-X303Down
Maps=SU-Asgard[Hard]
MapNum=0

; Walking speed x1.4 (SU: 250, UT2004: 440) and heavy weapons at 250 (SU: 150)
[SUTweaks.MutSUSpeed]
SpeedScale=1.4
HeavySpeed=250
